upstream django {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name any-vault.ru www.any-vault.ru;

    # ACME HTTP-01 challenge (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name any-vault.ru www.any-vault.ru;
    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/any-vault.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/any-vault.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/any-vault/html;
    index index.html;

    location /static/ {
        alias /var/www/any-vault/static/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /var/www/any-vault/media/;
        access_log off;
        expires 30d;
    }

    # Django API
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # frontend
    location / {
        try_files $uri $uri/ /index.html;
    }
}
